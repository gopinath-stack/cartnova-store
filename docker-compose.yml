services:
  db:
    image: postgres:17
    env_file: db.env
    environment:
      POSTGRES_DB: shopflow
      POSTGRES_USER: shopflow
    volumes:
      - dbdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
  
  backend:
    build: ./backend
    image: gopimano1997/cn-backend:${TAG:-latest}
    env_file: db.env
    environment:
      DB_HOST: db
    ports:
      - "5000:5000"
    depends_on:
      - db

  frontend:
    build: ./frontend
    image: gopimano1997/cn-frontend:${TAG:-latest}
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  dbdata:
